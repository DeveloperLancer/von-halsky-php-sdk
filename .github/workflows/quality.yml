name: Quality

on:
    pull_request:
    push:

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    COMPOSER_NO_INTERACTION: "1"
    COMPOSER_PREFER_STABLE: "1"

jobs:
    validate:
        name: Validate package and contract
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Validate Composer metadata
              run: composer validate --strict
            - name: Install locked dependencies
              run: composer install --no-progress
            - name: Audit dependencies
              run: composer audit
            - name: Validate PSR-4 autoloading
              run: composer dump-autoload --optimize --strict-psr
            - name: Validate contract resources
              run: composer contract-check
            - name: Validate documentation links
              run: composer docs-check

    quality:
        name: Tests, style, and PHPStan level 7
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Install locked dependencies
              run: composer install --no-progress
            - name: Run offline quality gate
              run: composer quality

    phpstan-max:
        name: PHPStan level 9
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Install locked dependencies
              run: composer install --no-progress
            - name: Run PHPStan level 9
              run: composer phpstan:max

    test-matrix:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Resolve current compatible dependencies
              run: |
                  composer config platform.php "$(php -r 'echo PHP_VERSION;')"
                  composer update --prefer-stable --no-progress
            - name: Audit resolved dependencies
              run: composer audit
            - name: Run tests
              run: composer test

    prefer-lowest:
        name: PHP 8.1 prefer-lowest
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Resolve lowest stable dependencies
              run: composer update --prefer-lowest --prefer-stable --no-plugins --no-progress
            - name: Audit resolved dependencies
              run: composer audit
            - name: Run offline quality gate
              run: composer quality

    symfony-http-matrix:
        name: Symfony HttpClient ${{ matrix.symfony }} on PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: "8.1"
                      symfony: "^6.4"
                    - php: "8.2"
                      symfony: "^7.4"
                    - php: "8.4"
                      symfony: "^8.1"
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Resolve selected Symfony line
              run: |
                  composer config platform.php "$(php -r 'echo PHP_VERSION;')"
                  composer require "symfony/http-client:${{ matrix.symfony }}" --no-update
                  composer update --with-all-dependencies --no-progress
            - name: Run HTTP unit tests
              run: vendor/bin/phpunit --testsuite unit

    guzzle-absent:
        name: Optional Guzzle absent
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Verify controlled missing-package behavior in a minimal consumer
              run: |
                  mkdir -p build/guzzle-absent
                  cd build/guzzle-absent
                  composer init --name=dev-lancer/guzzle-absent-smoke --no-interaction
                  composer config repositories.sdk path ../..
                  composer require dev-lancer/von-halsky-php-sdk:@dev --no-progress
                  php -r 'require "vendor/autoload.php"; try { \DevLancer\VonHalsky\Http\GuzzleHttpClientFactory::create(); } catch (\DevLancer\VonHalsky\Exception\MissingOptionalDependencyException $e) { exit(str_contains($e->getMessage(), "composer require guzzlehttp/guzzle") ? 0 : 2); } exit(1);'

    guzzle-present:
        name: Optional Guzzle present
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Verify optional factory in a minimal consumer
              run: |
                  mkdir -p build/guzzle-present
                  cd build/guzzle-present
                  composer init --name=dev-lancer/guzzle-present-smoke --no-interaction
                  composer config repositories.sdk path ../..
                  composer require dev-lancer/von-halsky-php-sdk:@dev guzzlehttp/guzzle:^7.9 --no-progress
                  php -r 'require "vendor/autoload.php"; $http = \DevLancer\VonHalsky\Http\GuzzleHttpClientFactory::create(); exit($http->httpClient instanceof \Psr\Http\Client\ClientInterface ? 0 : 1);'

    docs-build:
        name: Build API documentation
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP 8.1
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: "8.1"
                  extensions: curl, dom, intl, json, mbstring, simplexml, xml, xmlwriter, zip
                  coverage: none
                  tools: composer:v2
            - name: Install locked dependencies
              run: composer install --no-progress
            - name: Build documentation
              run: composer docs-build
            - name: Upload documentation preview
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: api-documentation
                  path: build/docs/api
                  if-no-files-found: error
                  retention-days: 7

    package-smoke:
        name: Install package archive on PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.1", "8.5"]
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json, zip
                  coverage: none
                  tools: composer:v2
            - name: Build package archive
              env:
                  COMPOSER_ROOT_VERSION: 0.1.0
              run: composer archive --format=zip --dir=build/package
            - name: Install archive in an empty project
              run: |
                  unzip build/package/dev-lancer-von-halsky-php-sdk-0.1.0.zip -d build/sdk-package
                  composer config version 0.1.0 --working-dir=build/sdk-package
                  mkdir -p build/consumer
                  cd build/consumer
                  composer init --name=dev-lancer/sdk-consumer-smoke --no-interaction
                  composer config repositories.sdk path "$GITHUB_WORKSPACE/build/sdk-package"
                  composer require dev-lancer/von-halsky-php-sdk:0.1.0 --no-progress
                  php -r "require 'vendor/autoload.php';"
                  package=vendor/dev-lancer/von-halsky-php-sdk
                  test -f "$package/composer.json"
                  test -f "$package/LICENSE"
                  test -d "$package/resources/contract"
                  test -d "$package/tools/contract"
                  test ! -e "$package/plan"
                  test ! -e "$package/var"
                  test ! -e "$package/tests"

    secret-scan:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - name: Check out full history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Scan changed history with TruffleHog
              uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
              with:
                  version: 3.96.0
                  extra_args: --only-verified

    dependency-review:
        name: Dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Review dependency changes
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: moderate
