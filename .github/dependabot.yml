version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "05:15"
          timezone: Europe/Warsaw
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - php
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "05:45"
          timezone: Europe/Warsaw
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - ci
